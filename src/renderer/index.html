<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https:"

  </head>
  <body class="bg-rf-bg text-rf-text font-body overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
