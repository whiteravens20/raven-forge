blank_issues_enabled: false

contact_links:
  - name: "\U0001F6E1️ Security Vulnerability"
    url: https://github.com/whiteravens20/raven-forge/security/advisories/new
    about: >
      Report a security vulnerability privately via GitHub's built-in private
      reporting. Do NOT open a public issue for security bugs, and redact any
      access token from logs before attaching them.

  - name: "\U0001F9E9 A mod or a modpack is the problem"
    url: https://github.com/whiteravens20/raven-packs/issues
    about: >
      A crash caused by one mod belongs with that mod's authors — this launcher
      ships their file, not their code. Anything about a White Ravens pack's
      contents or versions belongs in raven-packs. Open an issue here only if
      you believe the launcher installed the wrong thing.

  - name: "\U0001F426‍⬛ Contact White Ravens directly"
    url: https://whiteravens.net
    about: >
      Have a question, or would rather not open a GitHub account? Reach us
      through whiteravens.net. Attach the crash report the launcher wrote, the
      same as you would here.
