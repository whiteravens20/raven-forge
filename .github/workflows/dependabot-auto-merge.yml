name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# Patch bumps merge themselves; majors get a label and wait for a human.
#
# What makes this safe rather than reckless is two things holding at once:
#
#   1. `cooldown: default-days: 7` in dependabot.yml — nothing reaches a PR
#      until it has been public for a week, so this never lands a freshly
#      published (possibly compromised) release unattended.
#   2. Required status checks on the target branch — GitHub's auto-merge fires
#      as soon as the branch's requirements are met, so with none required that
#      would be immediately, CI unread. This branch requires:
#      `lint-and-typecheck`, `build-linux`, `build-windows`
#
# If either is ever removed, turn this workflow off with it.

jobs:
  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Who opened the pull request, as well as who set this run off: the second
    # alone is whoever acted on the pull request last, and need not be the one
    # whose changes are in it. zizmor flags any test of the second, and with the
    # first beside it there is nothing left to pass for Dependabot; the second
    # stays so that a push to the branch or a reopen by anyone else does not
    # start a merge.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' # zizmor: ignore[bot-conditions]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # --auto merges only once the branch's required status checks pass; they are the gate.
      - name: Auto-merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit "$PR_URL" --add-label "dependencies,major-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
