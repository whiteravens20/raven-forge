name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Production deps get a tighter bar (moderate) — these are what ends up
      # inside the installer on a user's machine. Dev deps (Vite, electron-builder
      # and their trees) stay at high to keep the noise manageable.
      #
      # audit-check.mjs wraps `npm audit` so that advisories with no installable
      # fix and no reachable code path can be allowlisted individually, with a
      # justification and an expiry, instead of lowering the threshold for every
      # package. See .github/scripts/audit-allowlist.json.
      - name: Audit production dependencies (moderate)
        run: node .github/scripts/audit-check.mjs --omit=dev --audit-level moderate

      - name: Audit all dependencies (high)
        run: node .github/scripts/audit-check.mjs --audit-level high

      # Verify every installed tarball has a valid registry signature. Catches
      # forged tarballs and tampered registry metadata at install time.
      # Requires a real install since `audit signatures` reads node_modules;
      # --ignore-scripts avoids the keytar native rebuild and the Electron
      # binary download, neither of which affects tarball signatures.
      - name: Install (for signature audit)
        run: npm ci --ignore-scripts

      - name: Verify package signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on pull requests — compares new deps against known vulnerabilities
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Any allowlisted ID goes here as `allow-ghsas:`, and its justification
          # in .github/scripts/audit-allowlist.json. Keep the two in sync.
          #
          # Deny licences that would conflict with redistributing the packaged
          # app. Raven Forge is AGPL-3.0-only, and these two are not compatible
          # with it, so a dependency under either cannot ship inside the installer.
          deny-licenses: GPL-2.0-only, SSPL-1.0

  scan:
    name: Trivy secret & config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scanners are limited to secret+misconfig on purpose: dependency
      # vulnerabilities are already gated by the audit job above, with an
      # allowlist that has justifications and expiries. Running Trivy's `vuln`
      # scanner here as well would report the same advisories through a second
      # channel that has no such allowlist, and the two would disagree.
      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Every action in these workflows is pinned to a commit SHA, with its version
  # in a comment. This checks that each SHA is the commit of the version named
  # beside it, so a wrong SHA and a tag moved upstream both fail here.
  pins:
    name: Pinned actions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each SHA against the tag it names
        run: .github/scripts/verify-pins.sh

  # Dependabot raises no alert for an action pinned by SHA, so this asks GitHub's
  # advisory database about every pinned version in its place.
  actions-audit:
    name: Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look up each pinned version in the advisory database
        run: .github/scripts/verify-pins.sh --advisories
        env:
          GH_TOKEN: ${{ github.token }}
